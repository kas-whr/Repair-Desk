# Gateway API поверх Envoy Gateway.
# GatewayClass `eg` обслуживается контроллером Envoy Gateway
# (controllerName: gateway.envoyproxy.io/gatewayclass-controller).
#
# Gateway `eg` поднимает data-plane (Envoy-прокси) в namespace envoy-gateway-system.
# Доступ локально — через port-forward на этот прокси (см. traffic.sh),
# т.к. на minikube LoadBalancer без `minikube tunnel` остаётся в Pending.
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: eg
spec:
  controllerName: gateway.envoyproxy.io/gatewayclass-controller
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: eg
  namespace: deploy-demo
spec:
  gatewayClassName: eg
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      # allowedRoutes по умолчанию разрешает HTTPRoute из того же namespace.
