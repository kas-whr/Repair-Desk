# ServiceMonitor для kube-prometheus-stack: Prometheus Operator сам найдёт все
# сервисы с меткой app=my-app в namespace deploy-demo и будет снимать метрики
# с именованного порта `metrics` (:9101, путь /metrics) каждые 15 секунд.
# Один ServiceMonitor покрывает my-app, my-app-v1 и my-app-v2 — у всех метка app=my-app.
#
# ВАЖНО про лейбл version: образ containersol/k8s-deployment-strategies:latest
# отдаёт http_requests_total{version=""} — счётчик в приложении инициализируется
# раньше, чем читается переменная VERSION (известная особенность образа). Поэтому
# берём версию не из метрики, а из метки пода version через relabeling. У подов
# v1 и v2 метки разные (version=v1.0.0 / v2.0.0), так что дашборд
# sum(rate(http_requests_total[2m])) by (version) корректно разводит версии —
# в том числе во время rolling update, когда в одном сервисе соседствуют v1 и v2.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: my-app
  namespace: deploy-demo
  labels:
    app: my-app
spec:
  selector:
    matchLabels:
      app: my-app
  namespaceSelector:
    matchNames:
      - deploy-demo
  endpoints:
    - port: metrics
      path: /metrics
      interval: 15s
      relabelings:
        # скопировать метку пода version в метку метрики version
        - sourceLabels: [__meta_kubernetes_pod_label_version]
          targetLabel: version
