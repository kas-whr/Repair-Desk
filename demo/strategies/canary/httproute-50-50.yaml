# CANARY — шаг 2: 50/50. Применяем, когда метрики v2 на 10% выглядят здоровыми.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-app
  namespace: deploy-demo
spec:
  parentRefs:
    - name: eg
  rules:
    - backendRefs:
        - name: my-app-v1
          port: 80
          weight: 50
        - name: my-app-v2
          port: 80
          weight: 50
