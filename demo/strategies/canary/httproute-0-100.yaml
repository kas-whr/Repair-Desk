# CANARY — шаг 3 (финал): 100% на v2. После этого старую v1 можно масштабировать
# в 0 или удалить. Откат на любом шаге — вернуть веса назад (90/10 или 100/0).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-app
  namespace: deploy-demo
spec:
  parentRefs:
    - name: eg
  rules:
    - backendRefs:
        - name: my-app-v1
          port: 80
          weight: 0
        - name: my-app-v2
          port: 80
          weight: 100
