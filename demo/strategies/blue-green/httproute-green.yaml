# BLUE/GREEN — весь трафик на «зелёную» (старую) версию v1.
# Обе версии (my-app-v1 и my-app-v2) задеплоены и готовы, но пользователи на v1.
# Переключение на blue — применить httproute-blue.yaml (тот же HTTPRoute `my-app`).
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-app
  namespace: deploy-demo
spec:
  parentRefs:
    - name: eg
  rules:
    - backendRefs:
        - name: my-app-v1   # green
          port: 80
