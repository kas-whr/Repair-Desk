# BLUE/GREEN — мгновенное переключение всего трафика на «синюю» (новую) версию v2.
# Применяем поверх httproute-green.yaml: HTTPRoute тот же (`my-app`), меняется
# только backendRef. Откат — так же мгновенно: снова применить green.
# Старая версия v1 остаётся поднятой ещё какое-то время — на случай отката.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: my-app
  namespace: deploy-demo
spec:
  parentRefs:
    - name: eg
  rules:
    - backendRefs:
        - name: my-app-v2   # blue
          port: 80
