apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: repairdesk-release
  namespace: repair-desk-release
spec:
  parentRefs:
  - name: repairdesk-eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/
      method: GET
    backendRefs:
    - name: release-v1
      port: 8080
    filters:
    - type: RequestMirror
      requestMirror:
        backendRef:
          name: release-shadow
          port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /api/
    backendRefs:
    - name: release-v1
      port: 8080
