apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: repairdesk-release
  namespace: repair-desk-release
spec:
  parentRefs:
  - name: repairdesk-eg
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /api/
      headers:
      - type: Exact
        name: x-user-group
        value: beta
    backendRefs:
    - name: release-v2
      port: 8080
  - matches:
    - path:
        type: PathPrefix
        value: /api/
    backendRefs:
    - name: release-v1
      port: 8080
