apiVersion: apps/v1
kind: Deployment
metadata:
  name: release-rolling
  namespace: repair-desk-release
spec:
  replicas: 2
  minReadySeconds: 10
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      release: release-rolling
  template:
    metadata:
      labels:
        app: repairdesk-release
        release: release-rolling
        version: v2.0.0
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '9090'
        prometheus.io/path: /metrics
    spec:
      terminationGracePeriodSeconds: 30
      containers:
      - name: api
        image: repair-desk-api:v2.0.0
        imagePullPolicy: IfNotPresent
        ports:
        - name: http
          containerPort: 8080
        - name: metrics
          containerPort: 9090
        envFrom:
        - secretRef:
            name: postgres-credentials
        env:
        - name: POSTGRES_HOST
          value: postgres.repair-desk.svc.cluster.local
        - name: POSTGRES_SSLMODE
          value: disable
        - name: SHADOW_READ_ONLY
          value: 'false'
        readinessProbe:
          httpGet:
            path: /readyz
            port: http
          periodSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          periodSeconds: 5
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 500m
            memory: 128Mi
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: release-rolling
  namespace: repair-desk-release
spec:
  selector:
    release: release-rolling
  ports:
  - name: http
    port: 8080
    targetPort: http
